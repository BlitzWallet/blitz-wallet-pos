[build]
  functions = ".netlify/functions"

[[redirects]]
  from = "/getUser"
  to = "https://proxy.blitz-wallet.com/getUser"
  status = 200
  force = true
  headers = {X-From = "Netlify"}
  signed = "API_SIGNATURE_TOKEN"

[[redirects]]
  from = "/addTxActivity"
  to = "https://proxy.blitz-wallet.com/addTxActivity"
  status = 200
  force = true
  headers = {X-From = "Netlify"}
  signed = "API_SIGNATURE_TOKEN"

  [[redirects]]
    from = "/createPOSInvoice"
    to = "https://proxy.blitz-wallet.com/createPOSInvoice"
    status = 200
    force = true
    headers = {X-From = "Netlify"}
    signed = "API_SIGNATURE_TOKEN"

  [[redirects]]
    from = "/getPOSPaylinkData"
    to = "https://proxy.blitz-wallet.com/getPOSPaylinkData"
    status = 200
    force = true
    headers = {X-From = "Netlify"}
    signed = "API_SIGNATURE_TOKEN"

# Catch-all redirect for SPA (React)
[[redirects]]
  from = "/*"
  to = "/index.html"
  status = 200

[build.environment]
  NODE_VERSION = "22.14.0"